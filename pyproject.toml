[project]
name = "heatedtopics"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "gne>=0.4.3",
    "playwright>=1.59.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0",
    "tzdata>=2025.2",
]

[project.scripts]
heated-topics = "heated_topics_v3.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heated_topics_v3"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

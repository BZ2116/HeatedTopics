[project]
name = "heatedtopics"
version = "0.1.0"
# Floor raised from 3.10 to 3.11 because openbiliclaw requires-python is >=3.11.
requires-python = ">=3.11"
dependencies = [
    "gne>=0.4.3",
    "openbiliclaw @ git+https://github.com/BZ2116/OpenBiliClaw.git@feature/heatedtopics-external-candidates",
    "openpyxl>=3.1.0",
    "playwright>=1.59.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0",
    "tzdata>=2025.2",
]

[project.scripts]
heated-topics = "heated_topics_v3.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heated_topics_v3"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
markers = [
    "requires_llm: requires real MiniMax API + Ollama",
    "requires_ollama: requires Ollama with bge-m3",
    "sanity: environment self-check; failures tell a new agent what to fix",
]
asyncio_mode = "auto"

[tool.ruff]
# Integration layer uses defensive patterns intentionally:
#   BLE001/S110: providers/ollama may raise arbitrary exceptions; we log + skip.
#   SIM102: nested-if kept readable for per-platform branching.
#   PLW1510: subprocess calls are best-effort guards with explicit timeout.
#   E501: long error message strings + test fixture lines kept for readability.
line-length = 88
lint.select = ["E", "F", "I", "RUF", "UP"]
lint.ignore = [
    "BLE001",
    "E501",
    "PLW1510",
    "S110",
    "SIM102",
]

[tool.ruff.lint.per-file-ignores]
# Test fixtures legitimately use CJK punctuation and long embedded strings.
"tests/**" = ["RUF001"]
# keyword_extractor.py contains Chinese prompt templates (CJK punctuation
# is required) and uses forward-reference quotes for LLMService (TYPE_CHECKING).
"src/heated_topics_v3/openbiliclaw_integration/keyword_extractor.py" = ["RUF001", "UP037"]

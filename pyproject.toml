[project]
name = "heatedtopics"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.59.0",
    "drissionpage>=4.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heated_topics_v3"]
